name: shop-api

services:
  web:
    container_name: shop-web
    build:
      context: .
      dockerfile: ./Dockerfile
      target: dev
    entrypoint: bash
    command: >
      -c "cd /code/shop_api && uvicorn main:app --reload --host=0.0.0.0 --port=8080"
    volumes:
      - ./alembic:/code/alembic
      - ./shop_api:/code/shop_api
      - ./tests:/code/tests
      - ./pyproject.toml:/code/pyproject.toml
      - ./.flake8:/code/.flake8
    env_file:
      - ./.envs/.local/app.secrets.env
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - postgres_network
    restart: unless-stopped

  db:
    container_name: shop-db
    image: postgres:17.5
    volumes:
      - postgres_data:/var/lib/postgresql/data/pgdata
    env_file:
      - ./.envs/.local/app.secrets.env
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - postgres_network
    restart: unless-stopped

networks:
  postgres_network:
    driver: bridge

volumes:
  postgres_data:
