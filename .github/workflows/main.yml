name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_PYTHON: "3.12"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Install dev tools
        run: uv sync --locked --only-group dev

      - name: ruff check
        run: uv run --no-sync ruff check .

      - name: ruff format
        run: uv run --no-sync ruff format --check .

  test:
    name: Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17.5
        env:
          POSTGRES_USER: shop
          POSTGRES_PASSWORD: shop
          POSTGRES_DB: shop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shop -d shop_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URI: postgresql+asyncpg://shop:shop@localhost:5432/shop_test
      SECRET_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      FIRST_SUPERUSER: admin@example.com
      FIRST_SUPERUSER_PASSWORD: change-this-password
      TESTS_REQUIRE_DB: "1"

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Apply migrations
        run: uv run --no-sync alembic upgrade head

      - name: Check for model/migration drift
        run: uv run --no-sync alembic check

      - name: Run tests
        run: uv run --no-sync pytest --cov --cov-fail-under=80

  image:
    name: Image
    runs-on: ubuntu-latest

    env:
      COMPOSE: docker compose --project-directory . -f docker/production.yml
      API: http://127.0.0.1:8080
      SUPERUSER: admin@example.com
      SUPERUSER_PASSWORD: change-this-password

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Write throwaway secrets
        run: |
          printf '%s\n' \
            "POSTGRES_DB=shop" \
            "POSTGRES_USER=shop" \
            "POSTGRES_PASSWORD=shop" \
            > .envs/.production/db.secrets.env
          printf '%s\n' \
            "SECRET_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef" \
            "FIRST_SUPERUSER=$SUPERUSER" \
            "FIRST_SUPERUSER_PASSWORD=$SUPERUSER_PASSWORD" \
            "DATABASE_URI=postgresql+asyncpg://shop:shop@db:5432/shop" \
            > .envs/.production/app.secrets.env

      - name: Build and start the production stack
        run: $COMPOSE up -d --build

      - name: Wait for the API
        run: |
          for _ in $(seq 1 30); do
            curl -fsS "$API/" && exit 0
            sleep 2
          done
          exit 1

      - name: Container does not run as root
        run: test "$($COMPOSE exec -T web id -u)" != "0"

      - name: Log in as the bootstrap superuser
        run: |
          curl -fsS -X POST "$API/api/v1/auth/token" \
            -d "username=$SUPERUSER" -d "password=$SUPERUSER_PASSWORD" \
            | grep -q '"access_token"'

      - name: Show logs
        if: failure()
        run: $COMPOSE logs
