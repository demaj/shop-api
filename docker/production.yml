# Self-contained production stack (NOT an override — empty lists do not reset a
# base service under compose merge, which silently leaks dev mounts/ports/secrets).
# Run from the repo root so relative paths resolve against it:
#   docker compose --project-directory . -f docker/production.yml up -d --build
name: shop-api-prod

services:
  proxy:
    container_name: shop-proxy
    image: haproxy:3.2
    environment:
      - TLS_DOMAIN
      - LOGIN_FAILURE_LIMIT
    ports:
      - "${PROXY_HTTP_BIND:-127.0.0.1:8080}:8080"
      - "${PROXY_HTTPS_BIND:-127.0.0.1:8443}:8443"
    volumes:
      - ./docker/haproxy/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
      - proxy_certs:/etc/haproxy/certs:ro
    networks:
      - postgres_network
    restart: unless-stopped

  web:
    container_name: shop-web
    build:
      context: .
      dockerfile: ./Dockerfile
      target: runtime
    env_file:
      - ./.envs/.production/app.secrets.env
    environment:
      FORWARDED_ALLOW_IPS: "*"
    mem_limit: ${WEB_MEMORY_LIMIT:-1g}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - postgres_network
    restart: unless-stopped

  db:
    container_name: shop-db
    image: postgres:17.5
    volumes:
      - postgres_data:/var/lib/postgresql/data/pgdata
    env_file:
      # Only Postgres credentials — never the app's SECRET_KEY / admin password.
      - ./.envs/.production/db.secrets.env
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - postgres_network
    restart: unless-stopped

networks:
  postgres_network:
    driver: bridge

volumes:
  postgres_data:
  proxy_certs:
