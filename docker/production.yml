# Production override — always combine with the base file:
#   docker compose -f docker-compose.yml -f docker/production.yml up -d --build
services:
  web:
    build:
      target: runtime
    entrypoint: ["/code/scripts/docker-entrypoint.sh"]
    command: []
    volumes: []
    env_file:
      - ../.envs/.production/app.secrets.env
    ports:
      - "127.0.0.1:8080:8080"

  db:
    env_file: []
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports: []
