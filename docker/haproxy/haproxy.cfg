global
    log stdout format raw local0 info
    maxconn 2000

defaults
    mode http
    log global
    option httplog
    option forwardfor
    timeout connect 5s
    timeout client 30s
    timeout server 60s
    timeout http-request 10s
    timeout http-keep-alive 10s
    http-error status 503 content-type application/problem+json string '{"type":"about:blank","title":"Service Unavailable","status":503,"detail":"Service temporarily unavailable","code":"service_unavailable"}'
    http-error status 502 content-type application/problem+json string '{"type":"about:blank","title":"Service Unavailable","status":503,"detail":"Service temporarily unavailable","code":"service_unavailable"}'
    http-error status 504 content-type application/problem+json string '{"type":"about:blank","title":"Service Unavailable","status":503,"detail":"Service temporarily unavailable","code":"service_unavailable"}'

resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 10s

backend login_failures
    stick-table type ipv6 size 100k expire 10m store gpc0_rate(1m)

frontend public
    bind :8080
.if strneq("${TLS_DOMAIN}","")
    bind :8443 ssl crt /etc/haproxy/certs/ alpn h2,http/1.1
    http-request redirect scheme https code 308 unless { ssl_fc }
    http-request return status 421 content-type application/problem+json string '{"type":"about:blank","title":"Misdirected Request","status":421,"detail":"Unknown host","code":"bad_request"}' unless { hdr(host),field(1,:) -i "${TLS_DOMAIN}" }
    http-response set-header Strict-Transport-Security "max-age=31536000"
.endif

    http-request set-header X-Request-Id %[uuid()] unless { req.hdr(X-Request-Id) -m found }
    http-request set-var(txn.request_id) req.hdr(X-Request-Id)
    http-request set-header X-Forwarded-Proto https if { ssl_fc }
    http-request set-header X-Forwarded-Proto http unless { ssl_fc }

    acl is_login path /api/v1/auth/token
    acl too_large req.hdr_val(content-length) gt 1048576

    http-request return status 413 content-type application/problem+json hdr X-Request-Id %[var(txn.request_id)] lf-string '{"type":"about:blank","title":"Content Too Large","status":413,"detail":"Request body is larger than 1 MiB","code":"payload_too_large","request_id":"%[var(txn.request_id)]"}' if too_large

    http-request track-sc0 src table login_failures if is_login METH_POST
    http-request return status 429 content-type application/problem+json hdr Retry-After 60 hdr X-Request-Id %[var(txn.request_id)] lf-string '{"type":"about:blank","title":"Too Many Requests","status":429,"detail":"Too many failed login attempts","code":"rate_limited","request_id":"%[var(txn.request_id)]"}' if is_login METH_POST { sc0_gpc0_rate ge "${LOGIN_FAILURE_LIMIT-5}" }

    http-response sc-inc-gpc0(0) if { status 401 } { sc0_tracked }
    http-response set-header X-Content-Type-Options nosniff
    http-response set-header Referrer-Policy no-referrer
    http-response set-header X-Frame-Options DENY

    default_backend web

backend web
    option httpchk GET /
    http-check expect status 200
    server web web:8080 check inter 5s fastinter 1s downinter 1s fall 3 rise 2 resolvers docker init-addr last,libc,none
